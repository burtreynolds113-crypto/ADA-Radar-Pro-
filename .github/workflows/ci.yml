name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: are
        run: python -m unittest discover -s tests -v
      - name: Approval gate (caps and kill switch changes need an approved record)
        working-directory: are
        run: python -m ops.approvals check
