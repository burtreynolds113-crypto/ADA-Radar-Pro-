<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17222D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rewired">
<title>Rewired by TrueBrain</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen" id="screen">
  <div class="bar"><div class="logo">Rewired<span>by TrueBrain</span></div><button class="iconbtn" id="refresh" hidden>Refresh</button></div>
  <div class="trace"><canvas id="sig" role="img" aria-label="Animated brainwave trace"></canvas></div>
  <div id="view"></div>
</div>
<div class="frame" id="frame" role="dialog" aria-modal="true" aria-labelledby="frameTitle">
  <div class="top"><button class="iconbtn" id="frameBack">Back</button><b id="frameTitle"></b></div>
  <iframe id="frameEl" title="Rewired content" referrerpolicy="no-referrer"></iframe>
</div>
<script src="config.js"></script>
<script src="trace.js"></script>
<script src="app.js"></script>
</body>
</html>
